limit_req_zone $binary_remote_addr zone=noters_auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Docker DNS is resolved on each connection, so a recreated backend works
    # without restarting Nginx even when its container IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $noters_backend http://backend:8080;

    location /api/ {
        proxy_pass $noters_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=noters_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $noters_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        proxy_pass $noters_backend/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /readyz {
        proxy_pass $noters_backend/readyz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
